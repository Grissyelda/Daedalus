//
// Daedalus default settings and key bindings
// Projects can override any of these in their own default.cfg or autoexec.cfg.
//

unbindall

// keep a log (qconsole.log in the save folder) so crashes and errors can be looked at
// afterwards; shipped games may turn this off
set logFile 2

//
// movement
//
bind	w			_forward
bind	s			_back
bind	a			_moveleft
bind	d			_moveright
bind	UPARROW		_forward
bind	DOWNARROW	_back
bind	LEFTARROW	_left
bind	RIGHTARROW	_right
bind	SPACE		_moveup
bind	c			_movedown
bind	SHIFT		_speed

//
// actions
//
bind	MOUSE1		_attack
bind	CTRL		_attack
bind	e			_use
bind	f			"_impulse16"	// flashlight

//
// system
//
bind	F5			"savegame quick"
bind	F9			"loadgame quick"
bind	F10			editorStop
bind	F12			screenshot

//
// gamepad (Steam Deck and controllers)
//
bind	JOY_STICK1_UP		_forward
bind	JOY_STICK1_DOWN		_back
bind	JOY_STICK1_LEFT		_moveleft
bind	JOY_STICK1_RIGHT	_moveright
bind	JOY_STICK2_UP		_lookup
bind	JOY_STICK2_DOWN		_lookdown
bind	JOY_STICK2_LEFT		_left
bind	JOY_STICK2_RIGHT	_right
bind	JOY_TRIGGER2		_attack
bind	JOY1				_moveup
bind	JOY3				_use
