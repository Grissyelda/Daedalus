// Pieces: make, place turned, override a part, edit in place, apply, undo
editorOpen testmaps/gt4_test_room
editorSave testmaps/piece_test
editorAddShape box 600 300 0 664 364 64
editorSelectAdd 4
editorMakePiece crate
editorListPieces
editorPlacePiece crate 200 200 0 90
editorListPieces
editorSelectPiece crate_1 light_entry
editorMove 0 0 32
editorSelectPiece crate_1 b0
editorMaterial textures/dev/grid_orange
editorListPieces
editorEditPiece crate_0
editorSelectPiece crate_0 b0
editorMove 0 0 8
editorAddShape box 600 300 64 632 332 96
editorEditPiece done
editorListPieces
editorSelectPiece crate_1 light_entry
editorPiecePart apply
editorListPieces
editorSave
editorUndo
echo AFTER-UNDO
editorListPieces
editorRedo
editorSave
wait 5
quit
