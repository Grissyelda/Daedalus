// Model import: the same 2 x 1 x 0.5 m box as .glb, .gltf (+.bin, pictures beside it) and .obj
editorOpen testmaps/test_room
editorImport "@ASSETS@/Wooden Crate.glb" place
editorImport "@ASSETS@/sub/crate.gltf"
editorImport "@ASSETS@/crate_obj.obj"
wait 20
echo FIRST-LIST
editorListImports
editorImportSize crate centimeters
editorImportTurn wooden_crate 90
editorImportTurn crate_obj 90
wait 20
echo SECOND-LIST
editorListImports
editorPlaceModel crate_obj 256 0 0
editorSave testmaps/import_test
wait 5
quit
