// Materials: from dropped pictures, from a preset, settings with undo, an editable copy, painted on a brush
editorOpen testmaps/test_room
editorSave testmaps/material_test
editorMaterialFromPictures "@ASSETS@/Brick_Wall_2K_Color.png" "@ASSETS@/Brick_Wall_2K_NormalGL.png" "@ASSETS@/brick_wall_2k_roughness.png" "@ASSETS@/brick_wall_2k_height.png" "@ASSETS@/poster.png"
wait 40
editorMaterialInfo textures/brick_wall
editorMaterialInfo textures/poster
editorNewMaterial lamp_glass Glass
editorMaterialSetting tint "0.5 0.8 1"
editorMaterialSetting opacity 0.4
editorMaterialInfo textures/lamp_glass
editorUndo
editorMaterialInfo textures/lamp_glass
editorRedo
editorMaterialCopy textures/dev/grid_floor
editorMaterialInfo textures/grid_floor
editorSelect 0 1
editorMaterial textures/brick_wall
editorProblems mats
editorSave testmaps/material_test
wait 5
quit
